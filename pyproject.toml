[project]
name = "funmind"
version = "0.0.3"
description = "XMind 思维导图文件读写库：以 XML 方式解析与生成 .xmind 工作簿，支持画布、主题树、标记、批注与样式操作"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = ["farlog>=1.1.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funmind"]

[dependency-groups]
dev = ["pytest>=8.0", "funbuild>=1.6.66"]
